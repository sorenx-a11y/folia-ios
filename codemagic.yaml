# Codemagic 云构建配置：在 macOS 构建机上编译 Folia iOS（iPhone/iPad 通用）IPA。
#
# 首次使用前，在 Codemagic 网页端完成：
# 1. Team settings -> codemagic.yaml settings -> Code signing identities
#    - iOS certificates 标签：上传你的 .p12 证书，并在弹窗里输入证书密码（只需上传一次，
#      不需要再建 CM_CERTIFICATE 之类的环境变量）。
#    - iOS provisioning profiles 标签：上传 .mobileprovision 描述文件。
#    页面会显示该描述文件是否与已上传证书匹配（绿色对勾）。
# 2. 连接本仓库，Codemagic 检测到本文件后会出现「Folia iOS (iPhone/iPad IPA)」工作流。
#
# 下面 ios_signing.distribution_type 决定导出的包类型，按你的用途改：
#   development  开发包，只能装在描述文件内登记 UDID 的设备，可用 Xcode/工具侧载
#   ad_hoc       内测包，设备 UDID 需提前登记，可通过分发平台/工具安装（个人自用推荐）
#   app_store    App Store / TestFlight 包，不能直接侧载
#
# 前端若有改动，推送到仓库即可，本流程会重新执行 vite build，无需手工同步 dist。
#
# 不想自己管证书/描述文件：见文件底部的 app_store_connect 自动签名备选方案。

workflows:
  folia-ipa:
    name: Folia iOS (iPhone/iPad IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: top.izuna.foliamajor
    cache:
      cache_paths:
        - node_modules
        - $HOME/.npm
        - $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
    triggering:
      events:
        - push
        - tag
    scripts:
      - name: 安装 Web 依赖（跳过 Electron/Playwright 二进制，Web 构建用不到）
        script: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm ci --no-audit --no-fund
      - name: 构建 Vite Web 产物（dist）
        script: npx vite build
      - name: 同步 Web 产物到 iOS 原生工程
        script: npx cap copy ios
      - name: 应用已安装的证书与描述文件到 Xcode 工程
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: 归档并签名导出 IPA（分发类型由上方 ios_signing 决定）
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/**/*.log

# ---------------------------------------------------------------------------
# 备选：App Store Connect 自动签名（无需上传 .p12 / 描述文件）
# 1. Codemagic Integrations 中添加 App Store Connect API key，记下它的引用名；
# 2. 在本工作流下添加顶层 integrations，environment.ios_signing 保持不变：
#
#    integrations:
#      app_store_connect: YOUR_API_KEY_REFERENCE_NAME
#
#    environment:
#      xcode: latest
#      node: 24
#      vars:
#        XCODE_PROJECT: ios/App/App.xcodeproj
#        XCODE_SCHEME: App
#      ios_signing:
#        distribution_type: ad_hoc   # development / ad_hoc / app_store
#        bundle_identifier: top.izuna.foliamajor
#
# 构建时 Codemagic 会用 API key 自动获取（必要时创建）匹配的证书和描述文件。
# ---------------------------------------------------------------------------
