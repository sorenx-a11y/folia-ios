# Codemagic 云构建配置：在 macOS 构建机上编译 Folia iOS（iPhone/iPad 通用）
# 的【未签名 IPA】。云端不做任何签名，拿到 IPA 后由你自行决定签名方式：
#   - Windows：Sideloadly / AltStore / 爱思助手 / ESign 等工具直接对该包重签名安装
#   - Mac：codesign、fastlane sigh 或 Xcode 重签名后安装
#   - 也可交给在线签名平台
# 因此在 Codemagic 后台【不需要】配置任何证书、描述文件或环境变量，
# 连接仓库后直接 Start build 即可。
#
# 前端若有改动，推送到仓库即可，本流程会重新执行 vite build，无需手工同步 dist。
#
# 如果以后想让云端直接出已签名包：参考文件底部的说明加回 ios_signing 段。

workflows:
  folia-ipa:
    name: Folia iOS 未签名 IPA (iPhone/iPad)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    cache:
      cache_paths:
        - node_modules
        - $HOME/.npm
        - $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
    triggering:
      events:
        - push
        - tag
    scripts:
      - name: 安装 Web 依赖（跳过 Electron/Playwright 二进制，Web 构建用不到）
        script: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm ci --no-audit --no-fund
      - name: 构建 Vite Web 产物（dist）
        script: npx vite build
      - name: 同步 Web 产物到 iOS 原生工程
        script: npx cap copy ios
      - name: 无签名归档（xcodebuild archive，跳过全部代码签名）
        script: |
          set -e
          ARCHIVE_PATH="$HOME/build/App.xcarchive"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: 将 .app 手工打包为未签名 IPA（Payload 结构）
        script: |
          set -e
          ARCHIVE_PATH="$HOME/build/App.xcarchive"
          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "未在归档中找到 .app，构建失败" >&2
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload build/ios/ipa
          cp -R "$APP_PATH" Payload/
          APP_NAME="$(basename "$APP_PATH" .app)"
          zip -qr "build/ios/ipa/${APP_NAME}-unsigned.ipa" Payload
          echo "已生成: build/ios/ipa/${APP_NAME}-unsigned.ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/**/*.log

# ---------------------------------------------------------------------------
# 以后若想让云端直接产出已签名 IPA：
# 1. Codemagic 后台 Team settings -> Code signing identities 上传 .p12 证书和
#    .mobileprovision 描述文件；
# 2. 在 environment 下加回签名段，并把上面的「无签名归档 + 手工打包」两个脚本
